[package]
name = "artcraft-launcher-web"
description = "ArtCraft Launcher in the browser: the Craft App Suite's latest releases, with downloads for the visitor's system"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "artcraft-launcher-web"
path = "src/main.rs"

[dependencies]
artcraft-launcher-core = { workspace = true }
artcraft-launcher-ui-egui = { workspace = true }
egui = { workspace = true }
# Unpacking the app zips (pure-Rust inflate, so it builds for wasm too).
flate2 = "1"
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Node", "Navigator", "Location", "MediaQueryList",
  "Request", "RequestInit", "RequestMode", "Response", "ResponseInit", "Headers",
  "ReadableStream", "ReadableStreamDefaultReader",
  "ServiceWorkerContainer", "CacheStorage", "Cache",
  "Crypto", "SubtleCrypto", "Storage",
] }
